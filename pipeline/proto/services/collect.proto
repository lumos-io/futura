syntax = "proto3";

package pipeline.collect;

option go_package = "github.com/opisvigilant/futura/pipeline/proto/gen;collect";

import "messages/collect.proto";

service CollectService {
  rpc SendEvent (messages.KubernetesEventBatch) returns (CollectAck);
  rpc SendMetric (messages.ContainerMetricBatch) returns (CollectAck);
}

message CollectAck {
  string status = 1; // "ok", "error"
  string message = 2;
}