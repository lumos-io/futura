---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-store
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-store
      app.kubernetes.io/instance: pipeline-store
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-store
        app.kubernetes.io/instance: pipeline-store
    spec:
      restartPolicy: Always
      containers:
        - name: pipeline-store
          image: ko://github.com/opisvigilant/futura/pipeline
          args: ["store"]
          ports:
            - containerPort: 50054 # Added container port 50054
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests: {}
          volumeMounts:
            - name: configuration
              mountPath: /opt/pipeline/config.toml
              subPath: config.toml
      volumes:
        - name: configuration
          configMap:
            name: pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-store
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: pipeline-store
    app.kubernetes.io/instance: pipeline-store
  ports:
    - protocol: TCP
      port: 50054 # Service port
      targetPort: 50054 # Container port
  type: ClusterIP
