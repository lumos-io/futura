---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-enrich
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-enrich
      app.kubernetes.io/instance: pipeline-enrich
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-enrich
        app.kubernetes.io/instance: pipeline-enrich
    spec:
      restartPolicy: Always
      containers:
        - name: pipeline-enrich
          image: ko://github.com/opisvigilant/futura/pipeline
          args: ["enrich"]
          ports:
            - containerPort: 50053 # Added container port 50053
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests: {}
          volumeMounts:
            - name: configuration
              mountPath: /opt/pipeline/config.toml
              subPath: config.toml
      volumes:
        - name: configuration
          configMap:
            name: pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-enrich
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: pipeline-enrich
    app.kubernetes.io/instance: pipeline-enrich
  ports:
    - protocol: TCP
      port: 50053 # Service port
      targetPort: 50053 # Container port
  type: ClusterIP
