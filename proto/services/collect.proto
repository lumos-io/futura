syntax = "proto3";

import "events/events.proto";
import "workload/workload.proto";

package collect;

option go_package = "github.com/opisvigilant/futura/proto/gen/collect;collect";


service CollectService {
  rpc SendEvent (events.KubernetesEventBatch) returns (CollectAck);
  rpc SendMetric (workload.ContainerMetricBatch) returns (CollectAck);
}

message CollectAck {
  string status = 1;
  string message = 2;
}