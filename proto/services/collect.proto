syntax = "proto3";

import "events/events.proto";
import "cluster/cluster.proto";

package collect;

option go_package = "github.com/opisvigilant/futura/proto/gen/collect;collect";


service CollectService {
  rpc SendEvents (events.KubernetesEventBatch) returns (CollectAck);
  rpc SendClusterObjects (cluster.KubernetesClusterObjectBatch) returns (CollectAck);
}

message CollectAck {
  string status = 1;
  string message = 2;
}