syntax = "proto3";

package stats;

option go_package = "github.com/opisvigilant/futura/proto/gen/stats;stats";

import "common/metadata.proto";
import "google/protobuf/timestamp.proto";

// Main batch message
message KubernetesEventBatch {
  common.APIKey apikey = 1;
  common.Metadata metadata = 2;
  repeated KubernetesResourceMetric resources = 3;
}

// ResourceMetric ties metrics to a resource.
message KubernetesResourceMetric {
  Resource resource = 1;
  MetricMetadata metric_metadata = 2;
  oneof metric_value {
    CPUMetrics cpu = 3;    
    MemoryMetrics memory = 4;
    FilesystemMetrics filesystem = 5;
    NetworkMetrics network = 6;
    VolumeMetrics volume = 7;
    UptimeMetrics uptime = 8;
  }
  google.protobuf.Timestamp timestamp = 9;
}

// Resource represents the metadata of the entity reporting the metrics.
message Resource {
  string kind = 1;              // Node, Pod, Container, etc.
  string name = 2;              // Name of the resource
  string namespace = 3;         // Namespace (if applicable)
  string uid = 4;               // Unique ID
  map<string, string> attributes = 5; // Extra tags/labels
}

// Metric represents a single metric datapoint.
message MetricMetadata {
  string name = 1;  
  string description = 2;
  map<string, string> labels = 3;
}

// Common CPU metrics
message CPUMetrics {
  double time = 1;
  double usage = 2;
  double utilization = 3;
  double node_utilization = 4;
  double limit_utilization = 5;
  double request_utilization = 6;
  google.protobuf.Timestamp timestamp = 7;
}

// Common Memory Metrics
message MemoryMetrics {
  uint64 available = 1;
  uint64 usage = 2;  
  double node_utilization = 3;
  double limit_utilization = 4;
  double request_utilization = 5;
  uint64 rss = 6;
  uint64 working_set = 7;
  uint64 page_faults = 8;
  uint64 major_page_faults = 9;
  google.protobuf.Timestamp timestamp = 10;  
}

// Filesystem Metrics
message FilesystemMetrics {
  uint64 available = 1;
  uint64 capacity = 2;
  uint64 usage = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Network Metrics
message NetworkMetrics {
  uint64 io_rx = 1;
  uint64 io_tx = 2;
  uint64 errors_rx = 3;
  uint64 errors_tx = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// Volume Metrics
message VolumeMetrics {
  uint64 available = 1;
  uint64 capacity = 2;
  uint64 inodes = 3;
  uint64 inodes_free = 4;
  uint64 inodes_used = 5;
  google.protobuf.Timestamp timestamp = 6;
}

// Uptime Metrics
message UptimeMetrics {
  int64 uptime = 1;
  google.protobuf.Timestamp timestamp = 2;
}
