syntax = "proto3";

package backend;

option go_package = "github.com/opisvigilant/futura/proto/gen/backend;backend";

// import "google/protobuf/timestamp.proto";

enum CloudProvider {
  AWS = 0;
  AZURE = 1;
  ALIBABA = 2;
  DIGITALOCEAN = 3;
  GCP = 4;
}

message CreateProviderConnectionRequest {
  CloudProvider provider = 1;
  string secret_id = 2;
  map<string,string> credentials = 3;		
}

message HelloResponse {
  string message = 1;
}