syntax = "proto3";

package telemetry;

option go_package = "github.com/opisvigilant/futura/proto/gen/telemetry;telemetry";

import "google/protobuf/timestamp.proto";
import "telemetry/metadata.proto";

// Main batch message
message KubernetesClusterObjectBatch {
  repeated KubernetesClusterObject objects = 3;
}

// Represents a generic Kubernetes object with rich metadata.
message KubernetesClusterObject {
  google.protobuf.Timestamp timestamp = 1;
  string type = 2; // snapshot | update | delete

  string kind = 3;
  string namespace = 4;
  string name = 5;
  string uid = 6;

  map<string, string> labels = 7;
  map<string, string> annotations = 8;

  string node_name = 9;
  string status = 10;
  string phase = 11;
  int64 restart_count = 12;

  string owner_kind = 13;
  string owner_name = 14;

  int64 replicas = 15;
  int64 ready_replicas = 16;
  int64 available_replicas = 17;
  int64 updated_replicas = 18;
  int64 current_replicas = 43;

  repeated ContainerSpec containers = 19;
  repeated VolumeSpec volumes = 20;

  repeated string tolerations = 21;
  map<string, string> affinity = 22;

  map<string, string> extra = 23;

  string api_version = 24;

  // for HPA
  int64 hpa_max_replicas = 25;
  int64 hpa_min_replicas = 26;
  string hpa_scale_target_ref = 27;

  // for Job
  int64 job_active = 28;
  int64 job_failed = 29;
  int64 job_succeeded = 30;
  int64 job_parallelism = 31;
  int64 job_completions = 32;

  // for Namespace
  int64 ns_phase_value = 33;

  // for Node
  string kubelet_version = 34;
  string os_type = 35;
  string os_image = 36;
  string container_runtime = 37;
  string container_runtime_version = 38;

  repeated NodeCondition conditions = 39;
  AllocatableResources allocatable = 40;

  // for Pod
  string pod_reason = 41;
  string qos_class = 42;

  // Cluster quota
  ClusterResourceQuotaMetadata cluster_quota = 44;

  // for daemonset
  int64 daemonset_current_number_scheduled = 45;
  int64 daemonset_desired_number_scheduled = 46;
  int64 daemonset_number_misscheduled = 47;
  int64 daemonset_number_ready = 48;

  APIKey apikey = 49;
  Metadata metadata = 50;

  // NEW: Cloud provider metadata (primarily for nodes)
  CloudNodeMetadata cloud_metadata = 51;

  EnrichmentMetadata enrichment = 100;
}

// Represents a container and its resource specs.
message ContainerSpec {
  string name = 1;
  string image = 2;
  ContainerResources resources = 3;
  string containerId = 4;
  int64 restarts_count = 5;
  int64 ready = 6;
  ContainerState state = 7;
  ContainerState last_termination_state = 8;
  string image_tag = 9;
}

// CPU/Memory requests and limits for a container.
message ContainerResources {
  ResourceQuantities limits = 1;
  ResourceQuantities requests = 2;
}

// Quantity strings, e.g. "500m", "128Mi"
message ResourceQuantities {
  string cpu = 1;
  string memory = 2;
  string storage = 3;
  string ephemeral_storage = 4;
}

// Volumes attached to a pod
message VolumeSpec {
  string name = 1;
  string type = 2; // EmptyDir, PVC, ConfigMap, etc.
}

// Represents the state of a container: only one of waiting, running, or
// terminated may be set.
message ContainerState {
  oneof state {
    ContainerStateWaiting waiting = 1;
    ContainerStateRunning running = 2;
    ContainerStateTerminated terminated = 3;
  }
}

// A waiting state of a container (not yet started)
message ContainerStateWaiting {
  string reason = 1;
  string message = 2;
}

// A running state of a container (currently executing)
message ContainerStateRunning { google.protobuf.Timestamp started_at = 1; }

// A terminated state of a container (exited or killed)
message ContainerStateTerminated {
  int64 exit_code = 1;
  int64 signal = 2;
  string reason = 3;
  string message = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  string container_id = 7;
}

message NodeCondition {
  string type = 1;   // e.g. "Ready"
  string status = 2; // "True", "False", "Unknown"
  string reason = 3;
  string message = 4;
}

message AllocatableResources {
  string cpu = 1;
  string memory = 2;
  string pods = 3;
  string ephemeral_storage = 4;
  map<string, string> others = 5;
}

message ClusterResourceQuotaMetadata {
  string name = 1;
  string uid = 2;

  repeated QuotaResource total_limits = 3;
  repeated QuotaResource total_usage = 4;

  repeated NamespaceQuota quotas = 5;
}

message NamespaceQuota {
  string namespace = 1;
  repeated QuotaResource limits = 2;
  repeated QuotaResource usage = 3;
}

message QuotaResource {
  string resource = 1; // e.g. "cpu", "memory", "count/pods"
  int64 value = 2;     // raw string, like "500m" or "2Gi"
}

// Cloud provider metadata for nodes (enables cluster scaling decisions)
message CloudNodeMetadata {
  string instance_type = 1;        // e.g., "m5.large", "e2-standard-4"
  string instance_family = 2;      // e.g., "m5", "e2-standard"
  string capacity_type = 3;        // "on-demand", "spot", "preemptible"
  string availability_zone = 4;    // e.g., "us-west-2a", "europe-west1-b"
  string cloud_provider = 5;       // "aws", "gcp", "azure", "alibaba", "digitalocean", "kind"

  // Resource specifications (useful for bin packing optimization)
  double cpu_cores = 6;           // total CPU cores for this instance type
  double memory_gb = 7;           // total memory in GB for this instance type
  double network_gbps = 8;        // network bandwidth in Gbps (optional)

  // Cost information (optional, can be enriched by engine later)
  double cost_per_hour = 9;       // current cost per hour in USD (optional)

  // Instance lifecycle info
  string launch_time = 10;        // when this node was launched (ISO 8601)
  string instance_id = 11;        // cloud provider instance ID

  // Spot instance specific (if applicable)
  double spot_price = 12;         // current spot price (optional)
  double interruption_risk = 13;  // 0.0 to 1.0, risk of interruption (optional)
}