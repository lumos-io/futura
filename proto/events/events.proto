syntax = "proto3";

package events;

option go_package = "github.com/opisvigilant/futura/proto/gen/events;events";

// -----------------------------
// Shared Messages
// -----------------------------

message Metadata {
  string idempotency_key = 1;
  string watcher_version = 2;
  string cluster_id = 3;
  string node_name = 4;
  string cloud_provider = 5;
  string kernel_version = 6;
}

// Main batch message
message KubernetesEventBatch {
  Metadata metadata = 1;
  repeated KubernetesEvent events = 2;
}

// Envelope for all possible event types
message KubernetesEvent {
  string ObjectKind = 1;
  string ObjectName = 2;
  string ObjectUID = 3;
  string ObjectFieldPath = 4;
  int64 ObjectTimestamp = 5;  // UNIX timestamp
  string ObjectNamespace = 6;
  int32 EventSeverityNumber = 7;
  string EventSeverityText = 8;
  string EventReason = 9;
  string EventAction = 10;
  string EventStartTime = 11;
  string EventName = 12;
  string EventMessage = 13;
  string EventUID = 14;
  int64 EventCount = 15;
}