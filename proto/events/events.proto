syntax = "proto3";

package events;

option go_package = "github.com/opisvigilant/futura/proto/gen/events;events";

// -----------------------------
// Shared Messages
// -----------------------------

message Metadata {
  string idempotency_key = 1;
  string watcher_version = 2;
  string cluster_id = 3;
  string node_name = 4;
}

// Main batch message
message KubernetesEventBatch {
  Metadata metadata = 1;
  repeated KubernetesEvent events = 2;
}

// Envelope for all possible event types
message KubernetesEvent {
  oneof event {
    PodEvent pod = 1;
    SvcEvent svc = 2;
    RsEvent rs = 3;
    DsEvent ds = 4;
    SsEvent ss = 5;
    DepEvent dep = 6;
    EpEvent ep = 7;
    ContainerEvent container = 8;
    JobEvent job = 9;
    CronJobEvent cronjob = 10;
  }
}

// -----------------------------
// Event Type Messages
// -----------------------------

message PodEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  string ip = 5;
  string owner_type = 6;
  string owner_name = 7;
  string owner_id = 8;
}

message SvcEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  string type = 5;
  repeated string cluster_ips = 6;
  repeated AddressPort ports = 7;
}

message RsEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  int32 replicas = 5;
  string owner_type = 6;
  string owner_name = 7;
  string owner_id = 8;
}

message DsEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
}

message SsEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
}

message DepEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  int32 replicas = 5;
}

message EpEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  repeated Address addresses = 5;
}

message ContainerEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  string pod = 5;
  string image = 6;
  repeated ContainerPort ports = 7;
}

message JobEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
  string owner_type = 5;
  string owner_name = 6;
  string owner_id = 7;
}

message CronJobEvent {
  string uid = 1;
  string event_type = 2;
  string name = 3;
  string namespace = 4;
}

// -----------------------------
// Address Structures
// -----------------------------

message AddressIP {
  string type = 1;       // "pod" or "external"
  string id = 2;         // Pod UID or empty
  string name = 3;
  string namespace = 4;  // Pod namespace or empty
  string ip = 5;         // IP address
}

message AddressPort {
  int32 port = 1;
  string protocol = 2;  // "TCP" or "UDP"
  string name = 3;
}

message Address {
  repeated AddressIP ips = 1;
  repeated AddressPort ports = 2;
}

message ContainerPort {
  AddressPort port = 1;
  string protocol = 2;
}


message ContainerMetric {
  Metadata metadata = 1;

  double cpu_usage_cores = 2;              // in CPU cores (e.g. 0.25)
  uint64 memory_usage_bytes = 3;           // current memory usage
  uint64 memory_working_set_bytes = 4;     // working set size
  uint64 rx_bytes = 5;                     // network received bytes
  uint64 tx_bytes = 6;                     // network transmitted bytes
  uint64 fs_usage_bytes = 7;               // filesystem usage
  double cpu_limit_cores = 8;              // from spec
  uint64 memory_limit_bytes = 9;           // from spec
}

message ContainerMetricBatch {
  repeated ContainerMetric metrics = 1;
}

service CollectService {
  rpc SendEvent (KubernetesEventBatch) returns (CollectAck);
  rpc SendMetric (ContainerMetricBatch) returns (CollectAck);
}

message CollectAck {
  string status = 1; // "ok", "error"
  string message = 2;
}