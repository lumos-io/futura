syntax = "proto3";

package collect;

option go_package = "github.com/opisvigilant/futura/proto/gen/collect;collect";

import "proto/events/events.proto";

service CollectService {
  rpc SendEvent (events.KubernetesEventBatch) returns (CollectAck);
  rpc SendMetric (events.ContainerMetricBatch) returns (CollectAck);
}

message CollectAck {
  string status = 1; // "ok", "error"
  string message = 2;
}