syntax = "proto3";

package engine;

option go_package = "github.com/opisvigilant/futura/proto/gen/engine;engine";

import "google/protobuf/timestamp.proto";

// --- ClusterOptimizationConfig ---

message ClusterOptimizationConfig {
  string api_key = 1;
  string cloud_provider = 2;
  string region = 3;
  string cost_sensitivity = 4;
  string monthly_budget = 5;
  repeated string preferred_instance_types = 6;
  bool allow_spot = 7;
  string max_spot_percentage = 8;
}

message ClusterOptimizationConfigRequest {
  ClusterOptimizationConfig config = 1;
}

message ClusterOptimizationConfigResponse {
  bool success = 1;
  string message = 2;
}

// --- ServiceLevelObjective ---

message ServiceLevelObjective {
  string service_name = 1;
  string target_p95_latency = 2; // e.g. "250ms"
  string target_error_rate = 3;  // e.g. "0.01"
  string target_throughput = 4;  // e.g. "1000rps"
  string priority = 5;            // e.g. "high"
  google.protobuf.Timestamp last_updated = 6;
}

message SyncSLORequest {
  ServiceLevelObjective slo = 1;
  string api_key = 2; // from ClusterOptimizationConfig, for auth
}

message SyncSLOResponse {
  bool success = 1;
  string message = 2;
}

// --- Service definition ---

message DecisionRequest {
  string cluster_id = 1; // Or API key, depending on how you identify clusters
}

message TargetRef {
  string kind = 1;
  string namespace = 2;
  string name = 3;
}

message HpaScaleAction {
  int32 replicas = 1;
}

message KarpenterProvisionAction {
  repeated string instance_types = 1;
  int32 count = 2;
  string capacity_type = 3; // on-demand / spot
}

message VpaRecommendAction {
  string container = 1;
  int32 cpu_request_mcpu = 2;
  int32 memory_mib = 3;
  string mode = 4; // recommendation / enforce
}

message Action {
  string type = 1; // e.g., "HPA_SCALE", "KARPENTER_PROVISION", "VPA_RECOMMEND"
  double confidence = 2;
  string reason = 3;

  oneof details {
    HpaScaleAction hpa_scale = 4;
    KarpenterProvisionAction karpenter_provision = 5;
    VpaRecommendAction vpa_recommend = 6;
  }
}

message ExpectedOutcomes {
  double predicted_latency_p95_ms = 1;
  double predicted_cost_delta_per_hour_usd = 2;
}

message DecisionResponse {
  string decision_id = 1;
  TargetRef target = 2;
  repeated Action actions = 3;
  ExpectedOutcomes expected_outcomes = 4;
}

service FuturaOptimizer {  
  rpc SyncClusterOptimizationConfig(ClusterOptimizationConfigRequest) returns (ClusterOptimizationConfigResponse);
  rpc SyncServiceLevelObjective(SyncSLORequest) returns (SyncSLOResponse);
  rpc GetOptimizationDecision(DecisionRequest) returns (DecisionResponse);
}