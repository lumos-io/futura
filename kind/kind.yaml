kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-cluster
featureGates:
  "APIServerTracing": true
  "KubeletTracing": true
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        serverTLSBootstrap: true
        featureGates:
          KubeletTracing: true
        tracing:
          samplingRatePerMillion: 100
        ---          
        kind: TracingConfiguration
        samplingRatePerMillion: 100
  - role: worker
  - role: worker
  - role: worker
