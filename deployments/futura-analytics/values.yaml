replicaCount: 2

image:
  repository: davideberdin/futura-analytics
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  grpcPort: 50061
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  grpc:
    port: 50061
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  grpc:
    port: 50061
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ClickHouse connection configuration
clickhouse:
  servers:
    - clickhouse:9000
  database: events
  username: user
  password: password
  existingSecret: ""
  existingSecretPasswordKey: clickhouse-password

# Analytics service configuration
analytics:
  endpoint: ":50061"
  logLevel: info

# Environment variables
env: []
# - name: CUSTOM_VAR
#   value: "value"

# Additional volumes
volumes: []
# - name: config
#   configMap:
#     name: analytics-config

# Volume mounts
volumeMounts: []
# - name: config
#   mountPath: /opt/analytics/config.toml
#   subPath: config.toml

nodeSelector: {}

tolerations: []

affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1
