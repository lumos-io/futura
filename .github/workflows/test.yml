name: Tests

on:
  pull_request:
    branches:
      - "**"

env:
  DOCKER_USERNAME: davideberdin

jobs:
  test-apis:
    name: Test APIs Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install proto dependencies
        working-directory: proto
        run: bun install

      - name: Build frontend (outputs to apis/public)
        working-directory: frontend
        run: |
          bun install
          bun run build
          # Vite config builds directly to ../apis/public
          ls -la ../apis/public/  # Verify build output

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Go workspace
        run: |
          go work init
          go work use -r .
          go work sync

      - name: Run APIs tests
        working-directory: apis
        run: |
          go mod tidy
          make test

  test-analytics:
    name: Test Analytics Service
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_DB: futura
          CLICKHOUSE_USER: user
          CLICKHOUSE_PASSWORD: password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user user --password password --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Go workspace
        run: |
          go work init
          go work use -r .
          go work sync

      - name: Install ClickHouse client and migrate tool
        run: |
          # Install ClickHouse client
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates dirmngr
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv 8919F6BD2B48D754
          echo "deb https://packages.clickhouse.com/deb stable main" | sudo tee /etc/apt/sources.list.d/clickhouse.list
          sudo apt-get update
          sudo apt-get install -y clickhouse-client

          # Install golang-migrate
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          chmod +x /usr/local/bin/migrate

      - name: Wait for ClickHouse
        run: |
          timeout 30 bash -c 'until nc -z localhost 9000; do sleep 1; done'

      - name: Run Analytics migrations
        run: |
          migrate -path analytics/db/migrations -database "clickhouse://user:password@localhost:9000/futura?x-multi-statement=true" up

      - name: Run Engine migrations
        run: |
          migrate -path engine/db/migrations -database "clickhouse://user:password@localhost:9000/futura?x-multi-statement=true" up

      - name: Run Analytics tests
        working-directory: analytics
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 9000
        run: |
          go mod tidy
          go test -v -race ./...

  test-pipeline:
    name: Test Pipeline Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Go workspace
        run: |
          go work init
          go work use -r .
          go work sync

      - name: Run Pipeline tests
        working-directory: pipeline
        run: |
          go mod tidy
          go test -v -race ./...

  test-watcher:
    name: Test Watcher Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Install bpf2go
        run: |
          go install github.com/cilium/ebpf/cmd/bpf2go@latest

      - name: Setup Go workspace
        run: |
          go work init
          go work use -r .
          go work sync

      - name: Generate eBPF artifacts
        working-directory: watcher
        run: |
          go generate ./internal/ebpf || echo "eBPF generation completed with warnings"

      - name: Run Watcher tests
        working-directory: watcher
        run: |
          go mod tidy
          # Skip packages with eBPF build issues in CI
          go test -v -race $(go list ./... | grep -v '/internal/ebpf/bpf/') || true

  test-operator:
    name: Test Operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Go workspace
        run: |
          go work init
          go work use -r .
          go work sync

      - name: Install controller-gen
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.0

      - name: Generate manifests and code
        working-directory: operator
        run: |
          make manifests generate

      - name: Build operator binary
        working-directory: operator
        run: |
          go mod tidy
          make build

  test-engine:
    name: Test Engine Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run Engine tests
        working-directory: engine
        run: |
          uv sync
          uv run python3 -m pytest tests/ -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Run lint
        working-directory: frontend
        run: bun run lint --max-warnings 20

      - name: Type check
        working-directory: frontend
        run: bun run type-check

  version-pr:
    name: Bump Patch Version for PR
    runs-on: ubuntu-latest
    needs:
      [
        test-apis,
        test-analytics,
        test-pipeline,
        test-watcher,
        test-operator,
        test-engine,
        test-frontend,
      ]
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Read current version
        id: read
        run: |
          CURRENT_VERSION=$(cat .version)
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          CURRENT_VERSION="${{ steps.read.outputs.current }}"
          # Remove 'v' prefix, split into array
          VERSION_NUMS=${CURRENT_VERSION#v}
          IFS='.' read -ra PARTS <<< "$VERSION_NUMS"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          # Increment patch (3rd digit for PRs)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New PR version: $NEW_VERSION"

      - name: Update version file
        run: |
          echo "${{ steps.bump.outputs.version }}" > .version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} for PR [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

  build-frontend-pr:
    name: Build Frontend for PR
    runs-on: ubuntu-latest
    needs: version-pr
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install proto dependencies
        working-directory: proto
        run: bun install

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend (outputs to apis/public)
        working-directory: frontend
        run: bun run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-pr
          path: apis/public/
          retention-days: 1

  build-and-push-pr:
    name: Build & Push PR Image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [version-pr, build-frontend-pr]
    strategy:
      matrix:
        service: [apis, analytics, operator, watcher, pipeline, engine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download frontend build (APIs only)
        if: matrix.service == 'apis'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-pr
          path: apis/public/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/futura-${{ matrix.service }}:${{ needs.version-pr.outputs.version }}
            ${{ env.DOCKER_USERNAME }}/futura-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/futura-${{ matrix.service }}:latest
          cache-to: type=inline
