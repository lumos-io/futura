name: Build and Push Images

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: davideberdin

jobs:
  version:
    name: Calculate and Update Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read
        run: |
          CURRENT_VERSION=$(cat .version)
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          CURRENT_VERSION="${{ steps.read.outputs.current }}"
          # Remove 'v' prefix, split into array
          VERSION_NUMS=${CURRENT_VERSION#v}
          IFS='.' read -ra PARTS <<< "$VERSION_NUMS"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          # Increment patch
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version file
        run: |
          echo "${{ steps.bump.outputs.version }}" > .version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [version, build-frontend]
    strategy:
      matrix:
        service: [apis, analytics, operator, watcher, pipeline, engine]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download frontend build (APIs only)
        if: matrix.service == 'apis'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apis/public/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/futura-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ env.DOCKER_USERNAME }}/futura-${{ matrix.service }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/futura-${{ matrix.service }}:latest
          cache-to: type=inline

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "### 🚀 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed to Docker Hub:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`davideberdin/futura-apis:${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`davideberdin/futura-analytics:${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`davideberdin/futura-operator:${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`davideberdin/futura-watcher:${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`davideberdin/futura-pipeline:${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`davideberdin/futura-engine:${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
