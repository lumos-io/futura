apiVersion: apps/v1
kind: Deployment
metadata:
  name: futura-engine-all
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-engine-all
    app.kubernetes.io/component: all-services
    app.kubernetes.io/part-of: futura
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1  # All services in one pod for small deployments
  selector:
    matchLabels:
      app.kubernetes.io/name: futura-engine-all
      app.kubernetes.io/component: all-services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: futura-engine-all
        app.kubernetes.io/component: all-services
        app.kubernetes.io/part-of: futura
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: futura-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: futura-engine
        image: futura/engine:latest
        imagePullPolicy: IfNotPresent
        command:
          - "uv"
          - "run"
          - "main.py"
          - "--config"
          - "/config/config.toml"
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - secretRef:
            name: futura-engine-secrets
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: model-cache
          mountPath: /app/models
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: model-cache
        emptyDir:
          sizeLimit: 10Gi
      - name: config
        configMap:
          name: futura-engine-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: futura-engine-all
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-engine-all
    app.kubernetes.io/component: all-services
    app.kubernetes.io/part-of: futura
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8080
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: futura-engine-all
    app.kubernetes.io/component: all-services
---
# LoadBalancer service for external access (optional)
apiVersion: v1
kind: Service
metadata:
  name: futura-engine-external
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-engine-external
    app.kubernetes.io/component: external-service
    app.kubernetes.io/part-of: futura
  annotations:
    # Cloud provider specific annotations can be added here
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  ports:
  - name: grpc
    port: 8080
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: futura-engine-all
    app.kubernetes.io/component: all-services