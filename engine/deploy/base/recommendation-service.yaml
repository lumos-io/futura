apiVersion: apps/v1
kind: Deployment
metadata:
  name: futura-recommendation-service
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-recommendation-service
    app.kubernetes.io/component: recommendation-service
    app.kubernetes.io/part-of: futura
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: futura-recommendation-service
      app.kubernetes.io/component: recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: futura-recommendation-service
        app.kubernetes.io/component: recommendation-service
        app.kubernetes.io/part-of: futura
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: futura-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: recommendation-service
        image: futura/engine:latest
        imagePullPolicy: IfNotPresent
        command:
          - "futura-engine"
          - "recommendation-service"
          - "--port=8080"
          - "--host=0.0.0.0"
          - "--rl-server-address=futura-rl-server.futura-engine.svc.cluster.local:8081"
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: futura-engine-config
        - secretRef:
            name: futura-engine-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - futura-engine
            - health
            - --endpoint=localhost:8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - futura-engine
            - health
            - --endpoint=localhost:8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: futura-recommendation-service
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-recommendation-service
    app.kubernetes.io/component: recommendation-service
    app.kubernetes.io/part-of: futura
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8080
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: futura-recommendation-service
    app.kubernetes.io/component: recommendation-service