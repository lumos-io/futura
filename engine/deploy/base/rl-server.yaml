apiVersion: apps/v1
kind: Deployment
metadata:
  name: futura-rl-server
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-rl-server
    app.kubernetes.io/component: rl-server
    app.kubernetes.io/part-of: futura
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1  # RL Server is typically singleton due to model state
  selector:
    matchLabels:
      app.kubernetes.io/name: futura-rl-server
      app.kubernetes.io/component: rl-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: futura-rl-server
        app.kubernetes.io/component: rl-server
        app.kubernetes.io/part-of: futura
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: futura-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: rl-server
        image: futura/engine:latest
        imagePullPolicy: IfNotPresent
        command:
          - "futura-engine"
          - "rl-server"
          - "--port=8081"
          - "--host=0.0.0.0"
        ports:
        - name: grpc
          containerPort: 8081
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GRPC_PORT
          value: "8081"
        envFrom:
        - configMapRef:
            name: futura-engine-config
        - secretRef:
            name: futura-engine-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          exec:
            command:
            - futura-engine
            - health
            - --endpoint=localhost:8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - futura-engine
            - health
            - --endpoint=localhost:8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: model-cache
          mountPath: /app/models
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: model-cache
        emptyDir:
          sizeLimit: 10Gi
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: futura-rl-server
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-rl-server
    app.kubernetes.io/component: rl-server
    app.kubernetes.io/part-of: futura
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8081
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: futura-rl-server
    app.kubernetes.io/component: rl-server