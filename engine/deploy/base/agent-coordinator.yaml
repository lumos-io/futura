apiVersion: apps/v1
kind: Deployment
metadata:
  name: futura-agent-coordinator
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-agent-coordinator
    app.kubernetes.io/component: agent-coordinator
    app.kubernetes.io/part-of: futura
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1  # Coordinator is singleton to avoid conflicts
  selector:
    matchLabels:
      app.kubernetes.io/name: futura-agent-coordinator
      app.kubernetes.io/component: agent-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: futura-agent-coordinator
        app.kubernetes.io/component: agent-coordinator
        app.kubernetes.io/part-of: futura
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: futura-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: agent-coordinator
        image: futura/engine:latest
        imagePullPolicy: IfNotPresent
        command:
          - "futura-engine"
          - "agent-coordinator"
          - "--port=8082"
          - "--host=0.0.0.0"
        ports:
        - name: grpc
          containerPort: 8082
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GRPC_PORT
          value: "8082"
        envFrom:
        - configMapRef:
            name: futura-engine-config
        - secretRef:
            name: futura-engine-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          exec:
            command:
            - futura-engine
            - health
            - --endpoint=localhost:8082
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - futura-engine
            - health
            - --endpoint=localhost:8082
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: futura-agent-coordinator
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-agent-coordinator
    app.kubernetes.io/component: agent-coordinator
    app.kubernetes.io/part-of: futura
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8082
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: futura-agent-coordinator
    app.kubernetes.io/component: agent-coordinator