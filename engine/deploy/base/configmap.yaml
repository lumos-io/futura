apiVersion: v1
kind: ConfigMap
metadata:
  name: futura-engine-config
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-engine
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: futura
data:
  # ClickHouse Configuration
  CLICKHOUSE_URL: "http://clickhouse.futura-engine.svc.cluster.local:8123"
  CLICKHOUSE_ENGINE_DB: "engine"
  CLICKHOUSE_ANALYTICS_DB: "analytics"

  # Training Configuration
  TRAINING_NAMESPACE: "futura-training"
  TRAINING_IMAGE: "futura/rl-trainer:latest"
  MODEL_STORAGE_URI: "s3://futura-models"

  # Service Configuration
  LOG_LEVEL: "INFO"
  GRPC_PORT: "8080"
  GRPC_HOST: "0.0.0.0"

  # RL Configuration
  RL_ALPHA: "0.3"
  RL_SLO_WEIGHT: "0.2"
  MAX_INSTANCES: "20"
  MAX_CPU_LIMIT: "4000"
  MAX_MEMORY_LIMIT: "8192"

  # Scaling Configuration
  VERTICAL_CPU_STEP: "256"
  VERTICAL_MEMORY_STEP: "256"
  HORIZONTAL_COOLDOWN_SECONDS: "300"
  VERTICAL_COOLDOWN_SECONDS: "180"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: futura-training-config
  namespace: futura-training
  labels:
    app.kubernetes.io/name: futura-training
    app.kubernetes.io/component: training-config
    app.kubernetes.io/part-of: futura
data:
  # Training Job Configuration
  JOB_TTL_SECONDS: "3600"
  TRAINING_CPU_REQUEST: "2"
  TRAINING_MEMORY_REQUEST: "4Gi"
  TRAINING_CPU_LIMIT: "4"
  TRAINING_MEMORY_LIMIT: "8Gi"

  # Training Parameters
  DEFAULT_HORIZON_HOURS: "12"
  DEFAULT_TRAINING_DATA_HOURS: "24"
  DEFAULT_EPISODES: "200"
  DEFAULT_LEARNING_RATE: "0.001"
  DEFAULT_BATCH_SIZE: "32"