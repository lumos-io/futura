apiVersion: v1
kind: ConfigMap
metadata:
  name: futura-engine-config
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-engine
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: futura
data:
  config-all.toml: |
    service = "all"

    [server]
    host = "0.0.0.0"
    port = 8080
    max_workers = 50
    log_level = "INFO"

    [clickhouse]
    url = "http://clickhouse.futura-engine.svc.cluster.local:8123"
    engine_db = "engine"
    analytics_db = "analytics"

    [training]
    namespace = "futura-training"
    image = "futura/rl-trainer:latest"
    model_storage_uri = "s3://futura-models"
    default_timeout_hours = 12

    [rl]
    default_horizon_hours = 24
    model_cleanup_hours = 168
    enable_drift_detection = true
    drift_check_interval_hours = 6

    [agent_coordinator]
    max_training_job_age_hours = 24
    cleanup_interval_hours = 1
    heartbeat_timeout_minutes = 10

    [recommendation]
    default_cpu_request_mcpu = 1000
    default_memory_request_mib = 512
    max_scale_up_ratio = 2.0
    max_scale_down_ratio = 0.5
    min_cooldown_seconds = 300

  config-recommendation.toml: |
    service = "recommendation"
    rl_server_address = "futura-rl-server.futura-engine.svc.cluster.local:8081"

    [server]
    host = "0.0.0.0"
    port = 8080
    max_workers = 50
    log_level = "INFO"

    [clickhouse]
    url = "http://clickhouse.futura-engine.svc.cluster.local:8123"
    engine_db = "engine"
    analytics_db = "analytics"

    [training]
    namespace = "futura-training"
    image = "futura/rl-trainer:latest"
    model_storage_uri = "s3://futura-models"
    default_timeout_hours = 12

    [rl]
    default_horizon_hours = 24
    model_cleanup_hours = 168
    enable_drift_detection = true
    drift_check_interval_hours = 6

    [agent_coordinator]
    max_training_job_age_hours = 24
    cleanup_interval_hours = 1
    heartbeat_timeout_minutes = 10

    [recommendation]
    default_cpu_request_mcpu = 1000
    default_memory_request_mib = 512
    max_scale_up_ratio = 2.0
    max_scale_down_ratio = 0.5
    min_cooldown_seconds = 300

  config-rl.toml: |
    service = "rl"

    [server]
    host = "0.0.0.0"
    port = 8081
    max_workers = 50
    log_level = "INFO"

    [clickhouse]
    url = "http://clickhouse.futura-engine.svc.cluster.local:8123"
    engine_db = "engine"
    analytics_db = "analytics"

    [training]
    namespace = "futura-training"
    image = "futura/rl-trainer:latest"
    model_storage_uri = "s3://futura-models"
    default_timeout_hours = 12

    [rl]
    default_horizon_hours = 24
    model_cleanup_hours = 168
    enable_drift_detection = true
    drift_check_interval_hours = 6

    [agent_coordinator]
    max_training_job_age_hours = 24
    cleanup_interval_hours = 1
    heartbeat_timeout_minutes = 10

    [recommendation]
    default_cpu_request_mcpu = 1000
    default_memory_request_mib = 512
    max_scale_up_ratio = 2.0
    max_scale_down_ratio = 0.5
    min_cooldown_seconds = 300

  config-agent-coordinator.toml: |
    service = "agent-coordinator"

    [server]
    host = "0.0.0.0"
    port = 8082
    max_workers = 50
    log_level = "INFO"

    [clickhouse]
    url = "http://clickhouse.futura-engine.svc.cluster.local:8123"
    engine_db = "engine"
    analytics_db = "analytics"

    [training]
    namespace = "futura-training"
    image = "futura/rl-trainer:latest"
    model_storage_uri = "s3://futura-models"
    default_timeout_hours = 12

    [rl]
    default_horizon_hours = 24
    model_cleanup_hours = 168
    enable_drift_detection = true
    drift_check_interval_hours = 6

    [agent_coordinator]
    max_training_job_age_hours = 24
    cleanup_interval_hours = 1
    heartbeat_timeout_minutes = 10

    [recommendation]
    default_cpu_request_mcpu = 1000
    default_memory_request_mib = 512
    max_scale_up_ratio = 2.0
    max_scale_down_ratio = 0.5
    min_cooldown_seconds = 300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: futura-training-config
  namespace: futura-training
  labels:
    app.kubernetes.io/name: futura-training
    app.kubernetes.io/component: training-config
    app.kubernetes.io/part-of: futura
data:
  # Training Job Configuration
  JOB_TTL_SECONDS: "3600"
  TRAINING_CPU_REQUEST: "2"
  TRAINING_MEMORY_REQUEST: "4Gi"
  TRAINING_CPU_LIMIT: "4"
  TRAINING_MEMORY_LIMIT: "8Gi"

  # Training Parameters
  DEFAULT_HORIZON_HOURS: "12"
  DEFAULT_TRAINING_DATA_HOURS: "24"
  DEFAULT_EPISODES: "200"
  DEFAULT_LEARNING_RATE: "0.001"
  DEFAULT_BATCH_SIZE: "32"