apiVersion: v1
kind: Secret
metadata:
  name: futura-engine-secrets
  namespace: futura-engine
  labels:
    app.kubernetes.io/name: futura-engine
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: futura
type: Opaque
data:
  # ClickHouse credentials (base64 encoded)
  # Default values - should be overridden in production
  CLICKHOUSE_USER: ZGVmYXVsdA==  # default
  CLICKHOUSE_PASSWORD: ""

  # S3 credentials for model storage
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: dXMtd2VzdC0y  # us-west-2

  # Optional: Custom CA certificates
  CA_CERTS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: futura-training-secrets
  namespace: futura-training
  labels:
    app.kubernetes.io/name: futura-training
    app.kubernetes.io/component: training-secrets
    app.kubernetes.io/part-of: futura
type: Opaque
data:
  # Training job secrets
  # Inherit from engine secrets but can override
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: dXMtd2VzdC0y  # us-west-2

  # Training-specific secrets
  TRAINING_TOKEN: ""