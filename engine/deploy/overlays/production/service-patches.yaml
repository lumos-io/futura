apiVersion: v1
kind: Service
metadata:
  name: futura-recommendation-service
  annotations:
    # Production service annotations
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  # Production may use LoadBalancer for external access
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: futura-rl-server
  annotations:
    # Internal service, keep as ClusterIP
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: ClusterIP
---
# HPA for recommendation service in production
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: futura-recommendation-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: futura-recommendation-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30