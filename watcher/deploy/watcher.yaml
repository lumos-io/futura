---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: watcher
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: watcher
      app.kubernetes.io/instance: watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watcher
        app.kubernetes.io/instance: watcher
    spec:
      restartPolicy: Always
      serviceAccountName: watcher
      containers:
        - name: watcher
          image: ko://github.com/opisvigilant/futura/watcher
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests: {}
          volumeMounts:
            - name: configuration
              mountPath: /opt/watcher/config.toml
              subPath: config.toml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
        - name: configuration
          configMap:
            name: watcher-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: watcher-config
  namespace: default
  labels:
    app.kubernetes.io/name: watcher
    app.kubernetes.io/instance: watcher
data:
  config.toml: |
    # Configuration file running Watcher locally

    title = "Configuration for Watcher Kubernetes"

    debug = true
    nodeName = "locahost"
    tag = "v0.0.1"

    [collect]
    host = "pipeline.default.svc.cluster.local"
    port = "50051"

    [kubernetes]
    authType = "serviceAccount" # required, valid values are `none`, `serviceAccount`, `kubeConfig`
    kubeContextName = ""
    namespaces = []
    distribution = "kubernetes" # either openshift or kubernetes
    collectionInterval = "" # in seconds, default is 10
    metadataCollectionInterval = "" # in minutes, default is 5
    leaseName = "futura" # required
    leaseNamespace = "default" # required
    leaseDuration = "" # in seconds, default is 15
    renewDeadline = "" # in seconds, default is 10
    retryPeriod = "" # in seconds, default is 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watcher
  namespace: default
  labels:
    app.kubernetes.io/name: watcher
    app.kubernetes.io/instance: watcher
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: watcher
  namespace: default
  labels:
    app.kubernetes.io/name: watcher
    app.kubernetes.io/instance: watcher
rules:
  - apiGroups:
      - ""
    resources:
      - events
      - namespaces
      - namespaces/status
      - nodes
      - nodes/spec
      - pods
      - pods/status
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
    resources:
      - daemonsets
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
# Source: watcher/templates/clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watcher
  namespace: default
  labels:
    app.kubernetes.io/name: watcher
    app.kubernetes.io/instance: watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: watcher
subjects:
  - kind: ServiceAccount
    name: watcher
    namespace: default
