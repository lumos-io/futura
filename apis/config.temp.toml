environment = "development"

[database]
host = "localhost"
port = "5432"
user = "postgres"
password = "postgres"
name = "futura"
sslmode = "disable"

[oauth]
[oauth.google]
client_id = "your-client-id"
client_secret = "your-client-secret"
callback_url = "http://localhost:8080/auth/google/callback"

[oauth.github]
client_id = ""
client_secret = ""
callback_url = "http://localhost:8080/auth/github/callback"

[secrets]
jwt_secret = ""
cookie_store_secret = ""
csfr_secret = ""

[frontend]
url = "http://localhost:8080/"

[temporal]
address = "localhost"
port = "7233"
namespace = "default"

[nats]
servers = ["nats://localhost:4222"]
apkBucket = "api_keys"

[unleash]
app_name = "futura-apis"
url = "http://localhost:4242/api/"
api_token = "default:development.unleash-insecure-api-token"