services:
  nats:
    image: docker.io/nats:2.9.22
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats:/data
    command:
      - "--name=nats"
      - "--cluster_name=c1"
      - "--cluster=nats://nats:6222"
      - "--routes=nats-route://nats:6222"
      - "--http_port=8222"
      - "--js"
      - "--sd=/data"

volumes:
  nats:
