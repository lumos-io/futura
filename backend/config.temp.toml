environment = "development"

[oauth]
[oauth.google]
client_id = "your-client-id"
client_secret = "your-client-secret"
callback_url = "http://localhost:8080/auth/google/callback"

[oauth.github]
client_id = ""
client_secret = ""
callback_url = "http://localhost:8080/auth/github/callback"

[secrets]
jwt_secret = ""
cookie_store_secret = ""
csfr_secret = ""

[frontend]
url = "http://localhost:8080/"

[unleash]
app_name = "futura-apis"
url = "http://localhost:4242/api/"
api_token = "default:development.unleash-insecure-api-token"

[database]
host = "localhost"
port = "5432"
user = "postgres"
password = "postgres"
name = "futura"
sslmode = "disable"

[clickhouse]
servers = ["localhost:9000"]
database = "futura"
username = "user"
password = "password"

[redis]
servers = ["localhost:6379"]
namespace = "apikeys"

[kafka]
brokers = ["localhost:9094"]

[collect]
endpoint = "localhost:50051"

[log]
level = "debug"